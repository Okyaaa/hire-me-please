[project]
name = "hire-me-please"
version = "0.1.0"
description = "Find, score, tailor, fill and submit job applications with Claude + Playwright"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75",
  "playwright>=1.48",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "markdown>=3.6",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
hire-me-please = "hire_me_please.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hire_me_please"]
